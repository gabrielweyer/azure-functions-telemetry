version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    ignore:
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.NET.Sdk.Functions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.DependencyInjection"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Logging.Console"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Configuration.UserSecrets"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.ApplicationInsights.WorkerService"
        update-types: ["version-update:semver-major"]
      # 5.18.0 depends on Microsoft.Extensions.* 10.x, which in-process Functions don't support
      - dependency-name: "Microsoft.Azure.WebJobs.Extensions.ServiceBus"
        versions: [">= 5.18.0"]
    groups:
      xunit:
        patterns:
          - xunit
          - xunit.analyzers
